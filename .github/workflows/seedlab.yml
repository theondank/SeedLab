name: CI/CD SeedLab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # FRONT
      - name: Installer les dépendances frontend
        working-directory: seedlab-front
        run: npm ci

      - name: Lint frontend
        working-directory: seedlab-front
        run: npm run lint

      - name: Build frontend
        working-directory: seedlab-front
        run: npm run build

      - name: Uploader l'artefact frontend
        uses: actions/upload-artifact@v4
        with:
          name: seedlab-front-dist
          path: seedlab-front/dist

      # BACK
      - name: Installer les dépendances backend
        working-directory: seedlab_backend
        run: npm ci

      - name: Vérifier le backend
        working-directory: seedlab_backend
        run: node --check src/server.js


  deploy:
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Télécharger l'artefact frontend
        uses: actions/download-artifact@v4
        with:
          name: seedlab-front-dist
          path: dist


      - name: Configurer l'authentification SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEBIAN_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Se connecter au tailnet (Tailscale)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Mettre à jour le backend
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEBIAN_USER }}@${{ secrets.DEBIAN_HOST }}" << 'EOF'
            cd /var/www/seedlab
            git pull origin main
            cd seedlab_backend
            npm ci
            pm2 restart seedlab-backend || \
            pm2 start src/server.js --name seedlab-backend
            pm2 save
          EOF

      - name: Déployer le frontend
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude 'seedlab_backend/' \
            --exclude 'seedlab-front/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            dist/ \
            "${{ secrets.DEBIAN_USER }}@${{ secrets.DEBIAN_HOST }}:/var/www/seedlab/"

          echo "Déploiement terminé."